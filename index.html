<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>길드 보스 정산</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#8fd4ff; --card:#fff4d8; --line:#2b1a0e; --ink:#3a2414; --muted:#6b4423; --accent:#ffd34d; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; color:var(--ink); font-family:"IBM Plex Sans KR",sans-serif; font-weight:600;
    background:linear-gradient(#8fd4ff 0%, #d7f1ff 26%, #7dce73 26%, #5eae55 100%); }
  button,input,select { font-family:inherit; color:inherit; }
  button { cursor:pointer; }
  .wrap { max-width:980px; margin:0 auto; padding:22px 16px 48px; position:relative; z-index:2; }
  header { display:flex; align-items:center; justify-content:center; gap:10px; text-align:left;
    background:#6b4423; color:#ffe7a3; border:4px solid #2b1a0e; border-radius:16px; padding:8px 16px; box-shadow:0 6px 0 #2b1a0e; }
  .cat-hit { position:relative; width:86px; height:80px; flex:0 0 auto; touch-action:none; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; user-select:none; }
  .cat-hit img, .cat-hit canvas { width:86px; height:80px; object-fit:fill; border:0; background:transparent; filter:drop-shadow(2px 3px 0 #2b1a0e); pointer-events:none; -webkit-user-drag:none; }
  .cat-hit canvas, .cat-hit video { position:absolute; left:0; top:0; width:100%; height:100%; object-fit:contain; pointer-events:none; background:transparent; filter:drop-shadow(2px 3px 0 #2b1a0e); }
  body.rained .wrap { filter: blur(4px); transition: filter .4s linear; }
  body.restored .wrap { filter: blur(0); transition: filter .8s ease; }
  #spitLayer { position:fixed; inset:0; z-index:60; pointer-events:none; overflow:hidden; }
  .loogie { position:fixed; width:92px; height:70px; object-fit:contain; filter:drop-shadow(0 6px 8px rgba(40,80,110,.25)); }
  .sheet { position:fixed; left:50%; top:46%; width:120vmax; height:120vmax; object-fit:cover; transform:translate(-50%,-50%); }
  h1 { margin:0; font-size:32px; font-weight:800; letter-spacing:-.03em; }
  header .sub { margin:2px 0 0; color:#f0d7a2; font-size:13px; font-weight:600; }
  nav { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; border:0; margin:14px 0 8px; }
  nav button { background:#c9843a; border:3px solid #2b1a0e; color:#fff8e8; border-radius:10px; padding:8px 14px; font-size:15px; font-weight:800; box-shadow:0 4px 0 #2b1a0e; }
  nav button.active { background:var(--accent); color:#3a2414; }
  .grid { display:grid; grid-template-columns:1.1fr .9fr; gap:14px; }
  .grid.solo { grid-template-columns:1fr; }
  .grid.solo #wheelCard { max-width:460px; margin:0 auto; }
  .card { border:4px solid #2b1a0e; border-radius:16px; padding:16px; background:#fff4d8; box-shadow:0 6px 0 #2b1a0e; }
  label { display:block; color:var(--muted); font-size:12px; margin:12px 0 6px; font-weight:800; }
  input,select { width:100%; background:#fff; border:3px solid #6b4423; border-radius:10px; padding:10px 12px; }
  .row { display:flex; gap:8px; align-items:center; }
  .row > * { flex:1; }
  .line { display:grid; grid-template-columns:1fr 88px auto; gap:8px; margin-bottom:8px; }
  .reward-line { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
  .reward-line .reward-name { flex:1 1 140px; font-weight:800; }
  #bossPick { width:100%; text-align:left; }
  .cat { margin:14px 0 6px; font-size:13px; color:#a15a24; font-weight:800; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  #pickList { max-height:52vh; overflow:auto; }
  .reward-line input[type=number] { flex:0 0 76px; width:76px; }
  .modebtn { flex:0 0 auto; width:auto; padding:8px 10px; }
  .modebtn:disabled { opacity:.45; }
  label.inline { display:flex; align-items:center; gap:6px; margin:0; color:var(--ink); font-size:13px; width:auto; }
  label.inline input { width:auto; }
  .btn,.ghost,.danger { border:3px solid #2b1a0e; border-radius:10px; padding:10px 14px; font-weight:800; box-shadow:0 4px 0 #2b1a0e; }
  .btn { background:var(--accent); color:#3a2414; }
  .ghost { background:#fff; color:#3a2414; }
  .danger { background:#fff; color:#8a3030; }
  .btn:disabled { opacity:.45; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
  .hidden { display:none !important; }
  #nowClock { text-align:center; font-size:40px; font-weight:800; letter-spacing:.04em; font-variant-numeric:tabular-nums; margin:12px 0 0; text-shadow:0 2px 0 #fff; }
  #scheduleLine { text-align:center; margin:2px 0 12px; font-weight:700; }
  #queueList { max-width:680px; margin:8px auto 0; }
  .q-item { background:#fff4d8; border:4px solid #2b1a0e; border-radius:16px; padding:12px 14px; margin-top:10px; box-shadow:0 5px 0 #2b1a0e; }
  #wheelStage { position:fixed; inset:0; z-index:25; display:grid; place-items:center; background:rgba(12,28,18,.55); padding:16px; }
  #wheelStage .card { width:min(980px,98vw); max-height:96vh; overflow:auto; animation:wheelPop .28s ease; }
  @keyframes wheelPop { from { transform:scale(.62); opacity:.35; } to { transform:scale(1); opacity:1; } }
  .wheel-grid { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; }
  .wheel-one { width:min(340px,86vw); }
  .wheel-grid.multi .wheel-one { width:min(230px,46vw); }
  .wheel-label { text-align:center; font-weight:800; margin-bottom:4px; }
  .wheel-wrap { min-height:0; display:grid; place-items:center; position:relative; }
  .wheel-one canvas { width:100%; height:auto; display:block; }
  .pointer { position:absolute; top:4px; width:0; height:0; border-left:10px solid transparent; border-right:10px solid transparent; border-top:16px solid #2b1a0e; }
  .hist-box { position:relative; border-bottom:2px solid #e7cba6; }
  button.hist { display:block; width:100%; text-align:left; background:transparent; border:0; box-shadow:none; border-radius:0; padding:12px 28px 12px 4px; font-weight:800; color:var(--ink); }
  .hist-x { position:absolute; top:6px; right:0; width:22px; height:22px; padding:0; border:0; border-radius:0; background:transparent; box-shadow:none; color:#c4472a; font-size:20px; line-height:20px; font-weight:800; }
  .floor-tab { background:#efe2c4; color:#3a2414; border:2px solid #8a6a3b; border-radius:99px; padding:6px 10px; font-weight:800; box-shadow:none; font-size:13px; }
  .floor-tab.on { background:#2b1a0e; color:#ffe7a3; }
  .choice-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:6px; }
  .choice { background:#ffd34d; color:#3a2414; border:3px solid #2b1a0e; border-radius:14px; box-shadow:0 4px 0 #2b1a0e; padding:16px 8px; font-weight:800; font-size:16px; }
  .pick-row { display:block; width:100%; text-align:left; background:#fff8e8; border:2px solid #c9843a; border-radius:12px; box-shadow:none; padding:12px; margin-top:8px; font-weight:800; color:#3a2414; }
  .group-card { margin-top:10px; }
  .group-body { display:flex; flex-direction:column; gap:6px; max-height:240px; overflow:auto; margin-top:8px; padding:8px; background:#fff8e8; border:2px solid #e7cba6; border-radius:12px; }
  #askModal { z-index:40; }
  .muted { color:var(--muted); }
  .bar { height:8px; background:#f0d7a2; border-radius:99px; overflow:hidden; border:2px solid #2b1a0e; }
  .bar span { display:block; height:100%; background:#e07a3d; }
  table { width:100%; border-collapse:collapse; }
  td { padding:10px 4px; border-bottom:2px solid #e7cba6; }
  .item { padding:12px 0; border-bottom:2px solid #e7cba6; }
  #fx { position:fixed; inset:0; pointer-events:none; z-index:20; }
  .modal-back { position:fixed; inset:0; background:rgba(30,20,10,.45); display:grid; place-items:center; z-index:30; }
  .modal { width:min(460px,92vw); max-height:86vh; overflow:auto; background:#fff4d8; border:5px solid #2b1a0e; border-radius:16px; padding:22px; text-align:center; box-shadow:0 8px 0 #2b1a0e; }
  .modal h2 { margin:8px 0 12px; font-size:32px; font-weight:800; }
  #splitPeople { max-height:46vh; overflow:auto; text-align:left; margin-top:8px; }
  #splitPeople label.inline { margin:8px 0; }
  @media (max-width:800px) {
    .grid { grid-template-columns:1fr; }
    h1 { font-size:26px; }
    .cat-hit, .cat-hit img, .cat-hit canvas { width:72px; height:67px; }
    #nowClock { font-size:32px; }
  }
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap">
  <header>
    <div id="catHit" class="cat-hit">
      <img id="guildCat" src="guild-cat-head.png" alt="" draggable="false" />
      <canvas id="catEyes" width="280" height="260"></canvas>
      <video id="catGather" class="hidden" playsinline muted preload="auto" src="cat-gather.webm"></video>
    </div>
    <div>
      <h1 id="title">우리 길드</h1>
    </div>
  </header>
  <nav id="nav">
    <button type="button" data-view="roulette" id="tabRoulette">룰렛</button>
    <button type="button" data-view="history">기록</button>
    <button type="button" data-view="members">길드원</button>
    <button type="button" data-view="settings" id="tabSettings">설정</button>
  </nav>
  <section id="view-roulette">
    <div id="nowClock">--:--:--</div>
    <div class="grid solo" id="rouletteGrid">
      <div class="card hidden" id="setupCard">
        <label>보스명</label>
        <button type="button" class="ghost" id="bossPick">보스를 선택하세요</button>
        <input id="boss" type="hidden" />
        <label>보상 · 수량</label>
        <div id="rewardRows"></div>
        <button type="button" class="ghost" id="addRewardRow">보상 추가</button>
        <label>잡은 날짜</label><input id="caughtDate" type="date" />
        <label>룰렛 실행</label>
        <div class="row">
          <input id="runDate" type="date" />
          <select id="runHour"></select>
          <select id="runMinute"></select>
        </div>
        <label class="inline" style="margin-top:8px"><input id="runNow" type="checkbox">즉시</label>
        <label>참여자 · 기여도</label>
        <div id="people"></div>
        <div class="actions">
          <button type="button" class="ghost" id="addPerson">참가자 추가</button>
          <button type="button" class="ghost" id="addAll">길드원 전체</button>
          <button type="button" class="ghost" id="cancelSetup">닫기</button>
        </div>
        <div id="preview"></div>
      </div>
    </div>
    <div id="leadBar" class="actions hidden" style="justify-content:center">
      <button type="button" class="btn" id="addRoulette">룰렛 추가</button>
      <button type="button" class="btn hidden" id="buildBtn">설정완료</button>
    </div>
    <div id="queueList"></div>
  </section>
  <section id="view-history" class="card hidden"><input id="q" placeholder="검색" /><div id="history"></div></section>
  <section id="view-members" class="card hidden"><div id="memberView"></div></section>
  <section id="view-settings" class="hidden">
    <div id="settingsBody" class="grid">
      <div class="card">
        <label>길드명</label>
        <div class="row"><input id="guildName" /><button type="button" class="btn" id="saveGuild">변경</button></div>
        <label>보스 목록</label>
        <div class="row">
          <input id="newBoss" placeholder="보스 이름" />
          <select id="newBossFloor">
            <option value="0">격전지하층</option>
            <option value="1" selected>격전지</option>
            <option value="5">격전지상층(1구역)</option>
            <option value="2">격전지상층(2구역)</option>
            <option value="3">격전지상층(3구역)</option>
            <option value="4">점령전</option>
          </select>
          <button type="button" class="ghost" id="addBoss">추가</button>
        </div>
        <div id="bossList"></div>
        <label>길마 · 부길마</label>
        <div class="row"><select id="leaderPick"></select><select id="vicePick"></select><select id="vicePick2"></select></div>
        <div class="actions"><button type="button" class="btn" id="saveRoles">직책 저장</button></div>
        <label>보상 목록</label>
        <div class="row"><input id="newReward" placeholder="보상 이름" /><button type="button" class="ghost" id="addReward">추가</button></div>
        <div id="rewardList"></div>
        <label>그룹</label>
        <div class="row"><input id="newGroup" placeholder="모자, 장갑, 점령지" /><button type="button" class="ghost" id="addGroup">그룹 추가</button></div>
        <div id="groupList"></div>
        <label>길드원 추가</label>
        <div class="row"><input id="newMember" placeholder="이름" /><button type="button" class="ghost" id="addMember">추가</button></div>
        <div id="memberEdit"></div>
      </div>
      <div class="card">
        <label>파이어베이스 주소</label>
        <input id="firebaseUrl" placeholder="https://프로젝트-default-rtdb.asia-southeast1.firebasedatabase.app" />
        <label>공유 코드</label>
        <input id="roomCode" placeholder="guild" />
        <div class="actions"><button type="button" class="btn" id="saveCloud">연동 저장</button></div>
        <p id="cloudMsg" class="muted"></p>
        <div class="actions">
          <button type="button" class="ghost" id="exportJson">백업</button>
          <button type="button" class="ghost" id="importJson">가져오기</button>
          <input id="importFile" type="file" accept="application/json" class="hidden" />
        </div>
      </div>
    </div>
  </section>
</div>
<div id="resultModal" class="modal-back hidden">
  <div class="modal">
    <div class="muted" id="resultWhen"></div>
    <h2 id="resultBoss" style="font-size:26px"></h2>
    <div id="resultBody"></div>
    <div class="actions" style="justify-content:center">
      <button type="button" class="ghost hidden" id="resultBack">뒤로</button>
      <button type="button" class="btn" id="resultShare">카카오톡 공유</button>
      <button type="button" class="btn" id="resultReplay">룰렛 돌리기</button>
      <button type="button" class="ghost" id="resultClose">닫기</button>
    </div>
  </div>
</div>
<div id="modal" class="modal-back hidden">
  <div class="modal"><div class="muted" id="winKicker">당첨</div><h2 id="winName"></h2><div id="winDetail"></div><p style="font-weight:800;margin:14px 0 0">카카오톡에 공유할까요?</p><div class="actions" style="justify-content:center"><button type="button" class="btn" id="shareYes">예</button><button type="button" class="ghost" id="closeModal">아니오</button></div></div>
</div>
<div id="pickModal" class="modal-back hidden">
  <div class="modal" style="text-align:left">
    <div id="pickTitle">선택</div>
    <div id="pickFloors" class="actions"></div>
    <div id="pickList"></div>
    <div class="actions"><button type="button" class="btn hidden" id="pickDone">확인</button><button type="button" class="ghost" id="pickClose">닫기</button></div>
  </div>
</div>
<div id="wheelStage" class="hidden">
  <div class="card">
    <div id="spinInfo" style="text-align:center;font-weight:800"></div>
    <div id="wheelGrid" class="wheel-grid"></div>
  </div>
</div>
<div id="askModal" class="modal-back hidden">
  <div class="modal">
    <p id="askText" style="font-weight:800;margin:0"></p>
    <div class="actions" style="justify-content:center">
      <button type="button" class="danger" id="askYes">삭제</button>
      <button type="button" class="ghost" id="askNo">취소</button>
    </div>
  </div>
</div>
<div id="splitModal" class="modal-back hidden">
  <div class="modal" style="text-align:left">
    <div style="font-weight:800">균등 분배</div>
    <div id="splitPeople"></div>
    <div class="actions">
      <button type="button" class="ghost" id="splitAll">전체 선택</button>
      <button type="button" class="ghost" id="splitCancel">취소</button>
      <button type="button" class="btn" id="splitOk">확인</button>
    </div>
  </div>
</div>
<script>
const KEY = "guild-boss-ledger-v3";
const COLORS = ["#5b7c99","#3f8f86","#d08a3a","#8a6bb5","#c46b5a","#6d8f5a","#4f7ea8","#b08968"];
const FLOORS = [
  {id:"0", label:"격전지하층"},
  {id:"1", label:"격전지"},
  {id:"5", label:"격전지상층(1구역)"},
  {id:"2", label:"격전지상층(2구역)"},
  {id:"3", label:"격전지상층(3구역)"},
  {id:"4", label:"점령전"}
];
const state = load();
let people = [];
let rewardDraft = [{name:"", qty:1, even:false, recipients:[], mode:"all"}];
let splitIndex = -1;
let splitNames = [];
let ready = null;
let rotation = 0;
let spinning = false;
let pushing = false;
let allowEmptyHistory = false;
const params = new URLSearchParams(location.search);
const leadMode = params.get("mode") === "lead";
const queryDb = params.get("db") || "";
const queryRoom = params.get("room") || "";
function load(){
  try {
    const s = JSON.parse(localStorage.getItem(KEY)||"null");
    if (s && s.members && s.bosses) return s;
  } catch (e) {}
  return { guild:"우리 길드", members:[], bosses:["악몽 보스"], rewards:[], history:[], dps:[], dpsByBoss:{}, bossFloors:{}, firebaseUrl:"https://cathero-91241-default-rtdb.asia-southeast1.firebasedatabase.app", room:"guild", rev:1 };
}
if (!state.rewards) state.rewards = [];
if (!state.dpsByBoss) state.dpsByBoss = {};
if (!state.bossFloors) state.bossFloors = {};
if (!state.history) state.history = [];
if (!Array.isArray(state.schedules)) state.schedules = [];
function ensureOccupation(){
  let changed = false;
  if (!state.bosses.includes("점령전보상")) { state.bosses.push("점령전보상"); changed = true; }
  if (!state.bossFloors) state.bossFloors = {};
  if (String(state.bossFloors["점령전보상"]) !== "4") { state.bossFloors["점령전보상"] = "4"; changed = true; }
  return changed;
}
if (ensureOccupation() || ensureGroups()) save();
if (queryDb) state.firebaseUrl = queryDb;
if (queryRoom) state.room = queryRoom;
function payload(){
  const history = Array.isArray(state.history) ? state.history : [];
  const body = {
    guild:state.guild, members:state.members, bosses:state.bosses, rewards:state.rewards||[],
    leader:state.leader||"", vice:state.vice||"", vice2:state.vice2||"",
    history, dps:state.dps||[], dpsByBoss:state.dpsByBoss||{}, bossFloors:state.bossFloors||{},
    groups:state.groups||[], groupItems:state.groupItems||{},
    schedule:state.schedule||null, schedules:state.schedules||[], firebaseUrl:state.firebaseUrl, room:state.room, rev:state.rev||1
  };
  if (history.length || allowEmptyHistory) body.historyCount = history.length;
  return body;
}
function save(){
  state.rev = (state.rev||1) + 1;
  state.updatedAt = Date.now();
  localStorage.setItem(KEY, JSON.stringify(state));
  document.getElementById("title").textContent = state.guild || "우리 길드";
  pushCloud();
}
function cloudUrl(){
  const base = (state.firebaseUrl||"").trim().replace(/\/+$/,"");
  const room = (state.room||"guild").replace(/[.#$\[\]]/g,"-");
  return base ? base + "/guild-ledger/" + encodeURIComponent(room) + ".json" : "";
}
async function pushCloud(){
  const url = cloudUrl();
  if (!url || pushing) return;
  pushing = true;
  try {
    const body = payload();
    if (!body.history.length && !allowEmptyHistory) {
      const cur = await fetch(url);
      const remote = cur.ok ? await cur.json() : null;
      const remoteHistory = remote && Array.isArray(remote.history) ? remote.history : [];
      if (remoteHistory.length) {
        state.history = remoteHistory;
        body.history = remoteHistory;
        body.historyCount = remoteHistory.length;
        localStorage.setItem(KEY, JSON.stringify(state));
        renderHistory();
      }
    } else if (body.history.length) allowEmptyHistory = false;
    await fetch(url, {method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  } catch (e) {}
  pushing = false;
}
async function pullCloud(){
  const url = cloudUrl();
  if (!url || spinning) return;
  try {
    const res = await fetch(url);
    if (!res.ok) return;
    const remote = await res.json();
    if (!remote || !remote.members || (remote.rev||0) <= (state.rev||0)) return;
    const localHistory = Array.isArray(state.history) ? state.history.slice() : [];
    const remoteHistory = Array.isArray(remote.history) ? remote.history : null;
    Object.assign(state, remote);
    let restoreHistory = false;
    if (!remoteHistory) {
      state.history = localHistory;
      restoreHistory = localHistory.length > 0;
    } else if (!remoteHistory.length && localHistory.length && remote.historyCount == null) {
      state.history = localHistory;
      restoreHistory = true;
    } else state.history = remoteHistory;
    if (!state.rewards) state.rewards = [];
    if (!state.dpsByBoss) state.dpsByBoss = {};
    if (!state.bossFloors) state.bossFloors = {};
    if (!Array.isArray(state.history)) state.history = [];
    if (!Array.isArray(state.schedules)) state.schedules = [];

function guessFloor(name){
  const n = String(name||"");
  if (/점령/.test(n)) return "4";
  if (/바나냥|루나|루니|루이/.test(n)) return "2";
  if (/상층\s*1|1구역/.test(n)) return "5";
  if (/상층\s*3|3구역|3층/.test(n)) return "3";
  if (/상층\s*2|2구역|2층/.test(n)) return "2";

  if (a >= 0 && b >= 0) {

  }

function rewardCategory(name){
  if (occupationNames().has(name)) return "점령전보상";
  const n = String(name || "");
  const nouns = ["목도리", "장갑", "신발", "모자", "소환서", "망토", "반지", "귀걸이", "룬"];
  for (const noun of nouns) if (n.includes(noun)) return noun;
  const colors = ["하얀색", "흰색", "초록색", "파란색", "빨간색", "노란색", "검은색", "검정색", "보라색", "분홍색", "주황색", "하늘색", "금색", "은색", "회색", "연두색", "청록색", "초록", "파란", "빨간", "노란", "검은", "검정", "보라", "분홍", "주황", "하늘", "흰"];
  let s = n.trim();
  for (const c of colors) {
    if (s.startsWith(c)) { s = s.slice(c.length).trim(); break; }
  }
  return s || n || "기타";
}
function rewardGroups(){
  const map = new Map();
  (state.groups || []).forEach(g => {
    const names = ((state.groupItems||{})[g] || []).filter(n => (state.rewards||[]).includes(n));
    if (names.length) map.set(g, names);
  });
  const placed = new Set();
  map.forEach(names => names.forEach(n => placed.add(n)));
  const loose = (state.rewards || []).filter(n => !placed.has(n));
  if (loose.length) map.set("미분류", loose);
  return [...map.entries()];
}
function ensureGroups(){
  if (Array.isArray(state.groups) && state.groupItems && typeof state.groupItems === "object") return false;
  const map = {};
  const order = [];
  (state.rewards || []).forEach(name => {
    const cat = rewardCategory(name);
    if (!map[cat]) { map[cat] = []; order.push(cat); }
    map[cat].push(name);
  });
  state.groups = order;
  state.groupItems = map;
  return true;
}

});

function paintWheel(canvas, list, rot){
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  const rows = list || [];
  const total = rows.reduce((s,p) => s+p.score, 0) || 1;
  ctx.clearRect(0,0,800,800);
  ctx.save();
  ctx.translate(400,400);
  ctx.rotate(rot||0);
  let angle = -Math.PI/2;
  if (!rows.length) {
    ctx.beginPath(); ctx.arc(0,0,300,0,Math.PI*2); ctx.fillStyle = "#fff4d8"; ctx.fill(); ctx.strokeStyle = "#2b1a0e"; ctx.lineWidth = 8; ctx.stroke();
  }
  rows.forEach((p,i) => {
    const slice = p.score/total*Math.PI*2;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,300,angle,angle+slice); ctx.closePath();
    ctx.fillStyle = COLORS[i%COLORS.length]; ctx.fill();
    if (slice > 0.25) {
      ctx.save(); ctx.rotate(angle+slice/2);
      ctx.font = "700 24px IBM Plex Sans KR, sans-serif"; ctx.textAlign = "right";
      ctx.lineWidth = 6; ctx.strokeStyle = "#2b1a0e"; ctx.strokeText(p.name, 260, 8);
      ctx.fillStyle = "#fff8e8"; ctx.fillText(p.name, 260, 8); ctx.restore();
    }
    angle += slice;
  });
  ctx.beginPath(); ctx.arc(0,0,70,0,Math.PI*2); ctx.fillStyle = "#fff4d8"; ctx.fill(); ctx.lineWidth = 8; ctx.strokeStyle = "#2b1a0e"; ctx.stroke();
  ctx.restore();
}

function rewardLines(item, detailed){

  const solo = list.filter(r => !r.even).length <= 1;

    if (r.even && detailed && r.split && r.split.length) {
      return esc(r.name)+" x"+r.qty+" · 균등 "+r.split.map(s => esc(s.name)+" "+s.qty).join(", ");
    }
    if (r.even) return esc(r.name)+" x"+r.qty+" · 균등분배";
    if (r.mode === "share") {
      if (detailed && r.split && r.split.length) return esc(r.name)+" x"+r.qty+" · 분배 "+r.split.map(s => esc(s.name)+" "+s.qty).join(", ");

    }

function splitEven(qty, names){
  const list = names.filter(Boolean);
  const q = Math.floor(Number(qty)||0);
  if (!list.length || q <= 0) return [];
  const base = Math.floor(q / list.length);
  let rem = q % list.length;
  const rows = list.map(name => ({name, qty:base}));
  const order = list.map(name => ({name, k:Math.random()})).sort((a,b) => a.k-b.k);
  for (let i = 0; i < rem; i++) {
    const row = rows.find(r => r.name === order[i].name);
    if (row) row.qty += 1;
  }
  return rows.filter(r => r.qty > 0);
}

function rollShare(qty, list){
  const q = Math.floor(Number(qty)||0);
  const tally = {};
  for (let i = 0; i < q; i++) {
    const won = pick(list);
    if (!won) break;
    tally[won.name] = (tally[won.name]||0) + 1;
  }
  return Object.keys(tally).map(name => ({name, qty:tally[name]})).sort((a,b) => b.qty - a.qty);
}
function shareParts(r){
  if (r.split && r.split.length) return r.split;
  if (!Array.isArray(r.draws)) return [];
  const tally = {};
  r.draws.forEach(n => { tally[n] = (tally[n]||0) + 1; });
  return Object.keys(tally).map(name => ({name, qty:tally[name]})).sort((a,b) => b.qty - a.qty);
}
function spinQueue(item){
  const list = normalizeRewards(item);
  const queue = [];
  list.forEach(r => {
    if (r.even) return;
    if (r.mode === "share") {
      const parts = shareParts(r);
      if (parts.length) {
        queue.push({reward:r.name+" 분배", qty:r.qty, winner:parts[0].name, score:0});
        return;
      }
    }
    if (r.winner) queue.push({reward:r.name, qty:r.qty, winner:r.winner, score:r.score||0});
  });
  if (queue.length) return queue;
  const allEven = list.length && list.every(r => r.even);
  if (allEven || !item || !item.winner || item.winner === "균등분배") return [];
  return [{reward:(list[0] && list[0].name) || "", winner:item.winner, score:item.score||0}];
}
function playQueue(list, queue, done, boss){
  document.getElementById("spinInfo").textContent = boss || "";
  const grid = document.getElementById("wheelGrid");
  if (!queue.length) { grid.innerHTML = ""; done(); return; }
  grid.classList.toggle("multi", queue.length > 1);
  grid.innerHTML = queue.map((item,i) => '<div class="wheel-one"><div class="wheel-label">'+esc(item.reward||"")+'</div><div class="wheel-wrap"><div class="pointer"></div><canvas data-wheel="'+i+'" width="800" height="800"></canvas></div></div>').join("");
  const wheels = queue.map((item,i) => ({canvas:grid.querySelector('[data-wheel="'+i+'"]'), winner:item.winner, rot:0}));
  spinning = true;
  ready = list;
  const anims = wheels.map(w => ({w, from:0, dest:destination(list, w.winner, 0)}));
  const t0 = performance.now();
  const step = now => {
    const t = Math.min(1, (now-t0)/4200);
    const ease = 1-Math.pow(1-t,4);
    anims.forEach(a => {
      a.w.rot = a.from + (a.dest-a.from)*ease;
      paintWheel(a.w.canvas, list, a.w.rot);
    });
    if (t < 1) requestAnimationFrame(step);
    else { spinning = false; done(); }
  };
  anims.forEach(a => paintWheel(a.w.canvas, list, 0));
  requestAnimationFrame(step);
}
function pick(list){
  let t = Math.random()*list.reduce((s,p) => s+p.score, 0);
  for (const p of list) { t -= p.score; if (t <= 0) return p; }
  return list[list.length-1];
}
function destination(list, winnerName, rot){
  const total = list.reduce((s,p) => s+p.score, 0);
  let start = -Math.PI/2;
  const rotation = rot || 0;
  for (const p of list) {
    const slice = p.score/total*Math.PI*2;
    if (p.name === winnerName) {
      const land = start + slice*0.5;
      const current = ((rotation%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
      const want = ((-Math.PI/2-land)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);
      return rotation + 6*Math.PI*2 + (want-current+Math.PI*2)%(Math.PI*2);
    }
    start += slice;
  }
  return rotation + 6*Math.PI*2;
}

  document.getElementById("leaderPick").innerHTML = "<option value=''>길마</option>"+state.members.map(m => "<option"+(m===state.leader?" selected":"")+">"+esc(m)+"</option>").join("");
  document.getElementById("vicePick").innerHTML = "<option value=''>부길마 1</option>"+state.members.map(m => "<option"+(m===state.vice?" selected":"")+">"+esc(m)+"</option>").join("");
  document.getElementById("vicePick2").innerHTML = "<option value=''>부길마 2</option>"+state.members.map(m => "<option"+(m===state.vice2?" selected":"")+">"+esc(m)+"</option>").join("");
  document.getElementById("bossList").innerHTML = state.bosses.map((b,i) => {
    const f = floorOf(b);
    const opts = FLOORS.map(fl => '<option value="'+fl.id+'"'+(fl.id===f?" selected":"")+">"+fl.label+"</option>").join("");
    return '<div class="row" style="margin-top:8px"><span>'+esc(b)+'</span><select data-boss-floor="'+i+'">'+opts+'</select><button type="button" class="danger" data-boss="'+i+'">삭제</button></div>';
  }).join("");
  document.querySelectorAll("[data-boss-floor]").forEach(el => el.onchange = () => {
    const name = state.bosses[Number(el.dataset.bossFloor)];
    if (!name) return;
    if (!state.bossFloors) state.bossFloors = {};
    state.bossFloors[name] = el.value;
    save();
  });
  document.querySelectorAll("[data-boss]").forEach(el => el.onclick = () => {
    const i = Number(el.dataset.boss);
    const name = state.bosses[i];
    askDelete((name||"보스")+"을 지울까요?", () => {
      state.bosses.splice(i, 1);
      if (name && state.bossFloors) delete state.bossFloors[name];
      save();
      fillSelects();
      renderSettings();
    });
  });
  document.getElementById("memberEdit").innerHTML = state.members.map((m,i) => '<div class="row" style="margin-top:8px"><span>'+esc(m)+" · "+esc(roleOf(m))+'</span><button type="button" class="danger" data-member="'+i+'">삭제</button></div>').join("");
  document.querySelectorAll("[data-member]").forEach(el => el.onclick = () => {
    const i = Number(el.dataset.member);
    const name = state.members[i];
    askDelete((name||"길드원")+"을 지울까요?", () => {
      state.members.splice(i, 1);
      save();
      renderSettings();
    });
  });
  document.getElementById("rewardList").innerHTML = (state.rewards||[]).map((b,i) => '<div class="row" style="margin-top:8px"><span>'+esc(b)+(groupsOf(b).length?'<span class="muted"> · '+esc(groupsOf(b).join(", "))+'</span>':"")+'</span><button type="button" class="danger" data-reward="'+i+'">삭제</button></div>').join("");
  document.querySelectorAll("[data-reward]").forEach(el => el.onclick = () => {
    const i = Number(el.dataset.reward);
    const name = state.rewards[i];
    askDelete((name||"보상")+"을 목록에서 지울까요?", () => {
      state.rewards.splice(i, 1);
      (state.groups||[]).forEach(g => {
        if (state.groupItems && state.groupItems[g]) state.groupItems[g] = state.groupItems[g].filter(n => n !== name);
      });
      save();
      fillSelects();
      renderSettings();
    });
  });
  const groups = state.groups || [];
  document.getElementById("groupList").innerHTML = groups.length ? groups.map(g => {
    const items = ((state.groupItems||{})[g] || []).filter(n => (state.rewards||[]).includes(n));
    const open = openGroup === g;
    const body = open ? '<div class="group-body">'+(state.rewards||[]).map(n => '<label class="inline"><input type="checkbox" data-gitem="'+esc(g)+'" data-gname="'+esc(n)+'"'+((items.includes(n))?" checked":"")+">"+esc(n)+"</label>").join("")+"</div>" : "";
    return '<div class="group-card"><div style="display:flex;gap:8px;align-items:center"><button type="button" class="floor-tab'+(open?" on":"")+'" data-group="'+esc(g)+'" style="flex:1">'+esc(g)+" "+items.length+'</button><button type="button" class="danger" data-del-group="'+esc(g)+'" style="flex:0 0 auto">삭제</button></div>'+body+"</div>";
  }).join("") : "<p class='muted'>그룹을 추가하세요.</p>";
  document.querySelectorAll("[data-group]").forEach(el => el.onclick = () => {
    openGroup = openGroup === el.dataset.group ? "" : el.dataset.group;
    renderSettings();
  });
  document.querySelectorAll("[data-gitem]").forEach(el => el.onchange = () => {
    const g = el.dataset.gitem;
    const n = el.dataset.gname;
    if (!state.groupItems[g]) state.groupItems[g] = [];
    state.groupItems[g] = state.groupItems[g].filter(x => x !== n);
    if (el.checked) state.groupItems[g].push(n);
    save();
    renderSettings();
  });
  document.querySelectorAll("[data-del-group]").forEach(el => el.onclick = () => {
    const g = el.dataset.delGroup;
    askDelete(g+" 그룹을 지울까요? 보상은 남습니다.", () => {
      state.groups = (state.groups||[]).filter(x => x !== g);
      if (state.groupItems) delete state.groupItems[g];
      if (openGroup === g) openGroup = "";
      save();
      renderSettings();
    });
  });
}
document.getElementById("addBoss").onclick = () => {
  const name = document.getElementById("newBoss").value.trim();
  if (!name || state.bosses.includes(name)) return;
  state.bosses.push(name);
  if (!state.bossFloors) state.bossFloors = {};
  state.bossFloors[name] = document.getElementById("newBossFloor").value || "1";
  document.getElementById("newBoss").value = "";
  save();
  fillSelects();
  renderSettings();
};
document.getElementById("addReward").onclick = () => {
  const name = document.getElementById("newReward").value.trim();
  if (!state.rewards) state.rewards = [];
  if (!name || state.rewards.includes(name)) return;
  state.rewards.push(name);
  document.getElementById("newReward").value = "";
  save();
  fillSelects();
  renderSettings();
};
document.getElementById("addGroup").onclick = () => {
  const name = document.getElementById("newGroup").value.trim();
  if (!name) return;
  if (!Array.isArray(state.groups)) state.groups = [];
  if (!state.groupItems) state.groupItems = {};
  if (state.groups.includes(name)) return;
  state.groups.push(name);
  state.groupItems[name] = [];
  document.getElementById("newGroup").value = "";
  openGroup = name;
  save();
  renderSettings();
};
document.getElementById("addMember").onclick = () => {
  const name = document.getElementById("newMember").value.trim();
  if (!name || state.members.includes(name)) return;
  state.members.push(name);
  document.getElementById("newMember").value = "";
  save();
  renderSettings();
};
document.getElementById("saveGuild").onclick = () => {
  state.guild = document.getElementById("guildName").value.trim() || "우리 길드";
  save();
  fillSelects();
};
document.getElementById("saveCloud").onclick = () => {
  state.firebaseUrl = document.getElementById("firebaseUrl").value.trim().replace(/\/+$/,"");
  state.room = document.getElementById("roomCode").value.trim() || "guild";
  save();
  document.getElementById("cloudMsg").textContent = cloudUrl() ? "연결했습니다. 같은 방으로 결과가 공유됩니다." : "주소를 비웠습니다.";
};
document.getElementById("saveRoles").onclick = () => {
  state.leader = document.getElementById("leaderPick").value;
  state.vice = document.getElementById("vicePick").value;
  state.vice2 = document.getElementById("vicePick2").value;
  save();
  renderSettings();
  renderMemberView();
};
document.getElementById("exportJson").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(payload(), null, 2)], {type:"application/json"}));
  a.download = "guild-ledger.json";
  a.click();
};
document.getElementById("importJson").onclick = () => document.getElementById("importFile").click();
document.getElementById("importFile").onchange = async e => {
  const file = e.target.files[0];
  if (!file) return;
  const data = JSON.parse(await file.text());
  if (!data.members || !data.bosses) return alert("백업 파일이 아닙니다.");
  Object.assign(state, data);
  if (!state.bossFloors) state.bossFloors = {};
  save();
  fillSelects();
  renderSettings();
};
const fx = document.getElementById("fx");
const fctx = fx.getContext("2d");
let sparks = [];
function resize(){ fx.width = innerWidth; fx.height = innerHeight; }
addEventListener("resize", resize);
resize();
function fireworks(){
  sparks = [];
  for (let i = 0; i < 28; i++) {
    const a = Math.random()*Math.PI*2, v = 1+Math.random()*2.4;
    sparks.push({x:innerWidth/2, y:innerHeight/2-40, vx:Math.cos(a)*v, vy:Math.sin(a)*v, life:36, color:COLORS[i%COLORS.length]});
  }
  tick();
}
function tick(){
  fctx.clearRect(0,0,fx.width,fx.height);
  sparks.forEach(s => { s.x += s.vx; s.y += s.vy; s.life--; fctx.globalAlpha = Math.max(s.life/36,0); fctx.fillStyle = s.color; fctx.fillRect(s.x,s.y,3,3); });
  sparks = sparks.filter(s => s.life > 0);
  if (sparks.length) requestAnimationFrame(tick);
}
function tickClock(){
  document.getElementById("nowClock").textContent = fmtFull(Date.now());
  trySpin();
}
applyRole();
fillSelects();
adoptSchedule();
showSchedule();
tickClock();
setInterval(tickClock, 1000);
setInterval(pullCloud, 4000);
(function(){
  const hit = document.getElementById("catHit");
  const canvas = document.getElementById("catEyes");
  const base = document.getElementById("guildCat");
  if (!hit || !canvas || !base) return;
  const ctx = canvas.getContext("2d");
  const eyes = [{x:86,y:154,rx:26,ry:15},{x:194,y:154,rx:26,ry:15}];
  let taps = 0;
  let side = 0;
  let timer = 0;
  let busy = false;
  let ready = false;
  function paint(dir){
    if (!ready) return;
    ctx.clearRect(0,0,280,260);
    ctx.drawImage(base,0,0,280,260);
    if (!dir) return;
    eyes.forEach(e => {
      ctx.fillStyle = "#8d8b8c";
      ctx.beginPath();
      ctx.ellipse(e.x, e.y, e.rx+6, e.ry+8, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(e.x, e.y+3, e.rx, e.ry*0.55, 0, 0, Math.PI*2);
      ctx.fillStyle = "#f4ebc4";
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = "#1b1b1b";
      ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(e.x + dir*9, e.y+4, 6.5, 7.5, 0, 0, Math.PI*2);
      ctx.fillStyle = "#141414";
      ctx.fill();
      ctx.fillStyle = "#8d8b8c";
      ctx.beginPath();
      ctx.ellipse(e.x, e.y-2, e.rx+2, e.ry*0.85, 0, Math.PI*1.02, Math.PI*1.98);
      ctx.fill();
    });
    ctx.strokeStyle = "#2a2a2a";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(128,134); ctx.quadraticCurveTo(140,124,152,136);
    ctx.moveTo(130,142); ctx.quadraticCurveTo(140,132,152,144);
    ctx.stroke();
  }
  if (base.complete) { ready = true; paint(0); }
  base.onload = () => { ready = true; paint(0); };
  function brow(){
    ctx.strokeStyle = "#2a2a2a";
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.moveTo(124,132); ctx.quadraticCurveTo(140,118,156,132);
    ctx.moveTo(126,140); ctx.quadraticCurveTo(140,128,156,140);
    ctx.stroke();
  }
  function cheek(x, y, fat){
    ctx.beginPath();
    ctx.ellipse(x, y, 18*fat, 13*fat, 0, 0, Math.PI*2);
    ctx.fillStyle = fat > 1.2 ? "#f8ead4" : "#e6d2ba";
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = "#2b1a0e";
    ctx.stroke();
  }
  function paintGather(puff, open){
    if (!ready) return;
    ctx.clearRect(0,0,280,260);
    ctx.drawImage(base,0,0,280,260);
    brow();
    const left = puff > 0 ? 1.6 : puff < 0 ? 0.82 : 1.35;
    const right = puff < 0 ? 1.6 : puff > 0 ? 0.82 : 1.35;
    cheek(76, 192, left);
    cheek(204, 192, right);
    ctx.beginPath();
    ctx.ellipse(140, 208, 24, 16, 0, 0, Math.PI*2);
    ctx.fillStyle = "#f4e6cc";
    ctx.fill();
    if (!open) {
      ctx.strokeStyle = "#1b1b1b";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(124 + puff*5, 206);
      ctx.quadraticCurveTo(140 + puff*5, 214, 156 + puff*5, 206);
      ctx.stroke();
      return;
    }
    ctx.beginPath();
    ctx.ellipse(140, 210, 12, 10, 0, 0, Math.PI*2);
    ctx.fillStyle = "#161616";
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = "#2b1a0e";
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(140, 212, 5, 4, 0, 0, Math.PI*2);
    ctx.fillStyle = "#e7a0b4";
    ctx.fill();
  }
  function mouthPoint(){
    const vid = document.getElementById("catGather");
    const r = (vid && !vid.classList.contains("hidden") ? vid : hit).getBoundingClientRect();
    return { x: r.left + r.width * 0.5, y: r.top + r.height * 0.72 };
  }
  function glance(){
    clearTimeout(timer);
    side = side === -1 ? 1 : -1;
    paint(side);
    timer = setTimeout(() => paint(0), 520);
  }
  function spitScreen(fromGather){
    busy = true;
    const layer = document.createElement("div");
    layer.id = "spitLayer";
    const glob = document.createElement("img");
    glob.src = "spit-glob.png";
    glob.className = "loogie";
    glob.alt = "";
    layer.appendChild(glob);
    document.body.appendChild(layer);
    const mouth = mouthPoint();
    const sx = mouth.x;
    const sy = mouth.y;
    const cx = innerWidth / 2;
    const cy = innerHeight / 2;
    glob.style.left = (sx - 46) + "px";
    glob.style.top = (sy - 24) + "px";
    glob.animate([
      { transform:"translate(0,0) scale(.04) rotate(0deg)", opacity:1 },
      { transform:"translate("+((cx-sx)*0.03)+"px,"+((cy-sy)*0.04)+"px) scale(.2) rotate(6deg)", opacity:1, offset:.2 },
      { transform:"translate("+(cx-sx)+"px,"+(cy-sy)+"px) scale(1.15) rotate(16deg)", opacity:1 }
    ], { duration:460, easing:"cubic-bezier(.2,.7,.2,1)", fill:"forwards" }).onfinish = () => {
      glob.remove();
      const sheet = document.createElement("img");
      sheet.src = "spit-sheet.png";
      sheet.className = "sheet";
      sheet.alt = "";
      layer.appendChild(sheet);
      sheet.animate([
        { opacity:0, transform:"translate(-50%,-50%) scale(.2)", filter:"blur(0px)" },
        { opacity:.95, transform:"translate(-50%,-50%) scale(1)", filter:"blur(0px)", offset:.18 },
        { opacity:.88, transform:"translate(-50%,-36%) scale(1.04)", filter:"blur(0px)", offset:.4 },
        { opacity:.5, transform:"translate(-50%,18%) scale(1.08)", filter:"blur(6px)", offset:.72 },
        { opacity:0, transform:"translate(-50%,78%) scale(1.12)", filter:"blur(14px)" }
      ], { duration:2700, easing:"cubic-bezier(.25,.05,.6,1)", fill:"forwards" });
      document.body.classList.add("rained");
      document.body.classList.remove("restored");
      setTimeout(() => {
        document.body.classList.remove("rained");
        document.body.classList.add("restored");
      }, 1600);
      setTimeout(() => {
        layer.remove();
        document.body.classList.remove("rained","restored");
        paint(0);
        if (!fromGather) busy = false;
      }, 2800);
    };
  }
  hit.addEventListener("contextmenu", e => e.preventDefault());
  hit.addEventListener("dragstart", e => e.preventDefault());
  base.addEventListener("contextmenu", e => e.preventDefault());
  function gatherThenSpit(){
    if (busy) return;
    busy = true;
    clearTimeout(timer);
    paint(0);
    const vid = document.getElementById("catGather");
    if (!vid) { spitScreen(false); return; }
    let fired = false;
    const launch = () => { if (!fired) { fired = true; spitScreen(true); } };
    const done = () => {
      vid.onended = null;
      vid.ontimeupdate = null;
      vid.pause();
      vid.classList.add("hidden");
      canvas.style.visibility = "";
      base.style.visibility = "";
      paint(0);
      busy = false;
    };
    canvas.style.visibility = "hidden";
    base.style.visibility = "hidden";
    vid.classList.remove("hidden");
    vid.onended = done;
    const watch = () => {
      if (fired || !vid.duration) return;
      if (vid.currentTime >= vid.duration * 0.88) launch();
      else if (!vid.ended && !vid.classList.contains("hidden")) requestAnimationFrame(watch);
    };
    try { vid.currentTime = 0; } catch (e) {}
    vid.playbackRate = 1.45;
    const play = vid.play();
    if (play && play.catch) play.catch(done);
    else requestAnimationFrame(watch);
    if (play && play.then) play.then(() => requestAnimationFrame(watch));
  }
  hit.addEventListener("pointerdown", e => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    e.preventDefault();
    if (busy) return;
    taps++;
    if (taps % 5 === 0) gatherThenSpit();
    else glance();
  });
})();
</script>
